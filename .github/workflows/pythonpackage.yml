# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    build:
        name: ${{ matrix.os }} (py ${{ matrix.version }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                version: ["3.10"]
                conda: [false]
        steps:
            -   uses: actions/checkout@v4

            -   name: Setup Conda
                if: matrix.conda == true
                uses: s-weigand/setup-conda@v1
                with:
                    update-conda: false

            -   name: Set up Python
                if: matrix.conda == false
                uses: actions/setup-python@v4
                with:
                    python-version: ${{ matrix.version }}

            -   name: Install dependencies
                run: |
                    pip install -e .[test]

            -   name: Info Conda
                if: matrix.conda == true
                run: |
                    source $CONDA/bin/activate test
                    conda info

            -   name: Info Python
                run: |
                    case "${{ matrix.conda }}" in
                        true)
                            source $CONDA/bin/activate test ;;
                    esac
                    which python
                    python --version

            -   name: Info installed packages
                run: |
                    case "${{ matrix.conda }}" in
                        true)
                            conda list -n test ;;
                        *)
                            pip list ;;
                    esac

            -   name: Run tests
                run: |
                    case "${{ matrix.conda }}" in
                        true)
                            source $CONDA/bin/activate test ;;
                    esac
                    pytest -m "not slow"

            -   name: Run codecov
                uses: codecov/codecov-action@v3
                with:
                    file: ./coverage.xml
                    name: codecov-umbrella

    Linting:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v4
                with:
                    python-version: '3.x'

            -   name: Install linters
                run: |
                    pip install "flake8>=3.8.0" "pydocstyle>=5.0.0"
                    pip install -e .
                    pip install mypy nano-CAT data-CAT types-PyYAML types-setuptools "numpy>=2.2.6"

            -   name: Python info
                run: |
                    which python
                    python --version

            -   name: Installed packages
                run: pip list

            -   name: Run flake8
                run: flake8 CAT tests

            -   name: Run pydocstyle
                run: pydocstyle CAT tests

            -   name: Run mypy
                run: mypy CAT
                continue-on-error: true
